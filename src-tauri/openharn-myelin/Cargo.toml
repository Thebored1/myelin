[package]
name = "openharn-myelin"
version = "0.1.0"
edition = "2021"
description = "openharn agent harness, served as a sidecar for Myelin (OpenAI-compatible, streaming SSE + HTTP tool callbacks)"
license = "MIT"

# Standalone sidecar binary. Deliberately small dependency surface — this is the
# openharn reliability loop (tool-call text recovery, context-fit, circuit
# breaker, strict grammar, prompt-tools) wrapped in an async SSE server so the
# Myelin Tauri backend can drive it and run its OWN tools via HTTP callbacks.
[[bin]]
name = "openharn-myelin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tokio-stream = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true

# Integration tests spawn the built sidecar binary and a mock llama-server, then
# drive a faithful (Myelin-mirroring) tool executor against a real .md file.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
regex = "1"
